name: Native Migration Audit
on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust-audit:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository_owner }}/graphvis-rust-dev:rust-1.98.0
    steps:
      - uses: actions/checkout@v4
      - name: Locked audit and dead-code scan
        run: bash scripts/audit_cull.sh
